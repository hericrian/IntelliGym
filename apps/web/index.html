<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="IntelliGym: monte treinos para casa ou academia, execute com guia passo a passo e acompanhe dor, carga e evolução."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />

    <!-- iOS não lê o manifest: a tela cheia e a barra de status vêm daqui. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="IntelliGym" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="IntelliGym" />

    <meta property="og:title" content="IntelliGym — Treino inteligente" />
    <meta
      property="og:description"
      content="Treinos para casa ou academia, execução guiada e acompanhamento de dor e evolução."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <title>IntelliGym — Treino inteligente</title>
    <style>
      /* Primeira pintura antes do CSS do app chegar: mesma cor de fundo, para
         não haver flash entre o HTML e o React. */
      html {
        background: #000000;
      }
      #boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #a8a3b3;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      #boot img {
        width: 176px;
        max-width: 62vw;
        height: auto;
        margin: 0 auto 14px;
      }
      #boot h1 {
        margin: 0 0 8px;
        font-size: 18px;
        color: #f8f8f8;
      }
      #boot p {
        margin: 0;
        max-width: 42ch;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div>
          <img src="/logo.png" alt="IntelliGym" width="176" height="57" />
          <h1>Carregando a plataforma</h1>
          <p>
            Se esta mensagem permanecer, verifique se o JavaScript está
            habilitado no navegador.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

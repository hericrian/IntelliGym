<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04090f" />
    <meta name="description" content="IntelliGym: plataforma inteligente de treinos para casa, academia e recuperação funcional." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
    <title>IntelliGym — Treino inteligente</title>
    <style>
      /* Primeira pintura antes do CSS do app chegar: mesma cor de fundo, para
         não haver flash entre o HTML e o React. */
      html { background: #04090f; }
      #boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #a2b6cb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      #boot strong {
        display: grid;
        width: 44px;
        height: 44px;
        margin: 0 auto 16px;
        place-items: center;
        border-radius: 14px;
        background: #3d9bff;
        color: #03101d;
        font-weight: 700;
      }
      #boot h1 { margin: 0 0 8px; font-size: 18px; color: #edf3fa; }
      #boot p { margin: 0; max-width: 42ch; font-size: 15px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div>
          <strong>IG</strong>
          <h1>IntelliGym</h1>
          <p>Carregando a plataforma. Se esta mensagem permanecer, verifique se o JavaScript está habilitado no navegador.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy API

# O frontend NÃO está aqui de propósito: o Cloudflare Pages já está ligado ao
# repositório pela integração Git e publica apps/web a cada push na main.
# Duplicar isso criaria dois caminhos de deploy competindo pelo mesmo site.
#
# Este workflow cuida do que o Pages não faz: migrações do D1 e o Worker.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  # Se dois commits caírem juntos, só o último vai ao ar.
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch não traz conclusion; por isso a segunda condição.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      # Sem as credenciais o job explica o que falta em vez de falhar com um
      # erro de autenticação do wrangler.
      - name: Verificar credenciais da Cloudflare
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN não configurado — deploy da API ignorado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Migrações antes do código: uma versão nova do Worker pode depender de
      # coluna que ainda não existe, mas o contrário nunca quebra.
      - name: Aplicar migrações no D1
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply intelligym --remote
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar a API
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy --minify --keep-vars
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Confere que subiu de verdade e que o banco está ligado, em vez de
      # confiar no exit code do wrangler.
      - name: Conferir a saúde da API
        if: steps.check.outputs.ready == 'true'
        run: |
          sleep 10
          saude=$(curl --fail --show-error --silent \
            https://intelligym-api.hericrianamf.workers.dev/health)
          echo "$saude"
          echo "$saude" | grep -q '"database":"d1"' \
            || { echo "::error::A API subiu sem o binding do D1."; exit 1; }

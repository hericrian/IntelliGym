name: Deploy Worker

# A API só sobe depois que a CI passa, e apenas a partir da main.
on:
  push:
    branches: ["main"]
    paths:
      - "apps/worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      # Sem o segredo configurado o job termina explicando o que falta, em vez
      # de falhar com erro de autenticação do wrangler.
      - name: Verificar credenciais
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN não configurado — deploy ignorado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Testes da API
        if: steps.check.outputs.ready == 'true'
        run: npm --workspace apps/worker run test

      - name: Aplicar migrações no D1
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply intelligym --remote
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
